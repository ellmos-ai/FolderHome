<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="folder-back-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="folder-front-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="folder-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#FDE68A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="gold-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="center-glow" cx="250" cy="180" r="180">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="28" fill="#0A0F1D" stroke="#1E293B" stroke-width="2"/>
  <circle cx="250" cy="180" r="180" fill="url(#center-glow)"/>

  <!-- ================= EMBLEM (CENTERED) ================= -->
  <g transform="translate(150, 70)" filter="url(#soft-shadow)">
    <!-- Back of Folder -->
    <path d="M 0 30 L 0 160 C 0 168 6 174 14 174 L 186 174 C 194 174 200 168 200 160 L 200 45 C 200 37 194 31 186 31 L 96 31 L 76 10 C 72 6 67 4 62 4 L 14 4 C 6 4 0 10 0 18 Z"
          fill="url(#folder-back-grad)" stroke="#92400E" stroke-width="1.5"/>

    <!-- Paper sheets -->
    <rect x="18" y="18" width="164" height="130" rx="6" fill="#F8FAFC" opacity="0.95"/>
    <line x1="32" y1="36" x2="100" y2="36" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="48" x2="150" y2="48" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="60" x2="135" y2="60" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>

    <!-- Front Folder Pocket -->
    <path d="M 0 65 L 0 160 C 0 168 6 174 14 174 L 186 174 C 194 174 200 168 200 160 L 200 65 C 200 58 194 53 186 53 L 14 53 C 6 53 0 58 0 65 Z"
          fill="url(#folder-front-grad)" stroke="#FDE68A" stroke-width="1.5"/>
    <path d="M 2 65 C 2 59 7 55 14 55 L 186 55 C 193 55 198 59 198 65 L 198 80 L 2 80 Z" fill="url(#folder-shine)" />

    <!-- Modern House Silhouette -->
    <g transform="translate(42, 70)">
      <rect x="74" y="8" width="10" height="20" rx="1" fill="#FFFFFF" opacity="0.95"/>
      <path d="M 0 38 L 58 0 L 116 38 L 106 48 L 58 16 L 10 48 Z" fill="#FFFFFF" filter="url(#gold-glow)"/>
      <path d="M 16 42 L 16 88 C 16 90 18 92 20 92 L 96 92 C 98 92 100 90 100 88 L 100 42 Z" fill="#0F172A" opacity="0.88" stroke="#FDE68A" stroke-width="1.5"/>

      <!-- Glowing Window Grid -->
      <rect x="30" y="52" width="16" height="16" rx="2" fill="#FBBF24" filter="url(#gold-glow)"/>
      <line x1="38" y1="52" x2="38" y2="68" stroke="#78350F" stroke-width="1.2"/>
      <line x1="30" y1="60" x2="46" y2="60" stroke="#78350F" stroke-width="1.2"/>

      <!-- Door -->
      <rect x="62" y="58" width="18" height="34" rx="2" fill="#1E293B" stroke="#FDE68A" stroke-width="1"/>
      <circle cx="75" cy="74" r="1.5" fill="#FBBF24"/>
    </g>

    <!-- Shield Vault Lock -->
    <g transform="translate(132, 98)">
      <path d="M 28 0 C 44 0 56 6 56 6 C 56 24 50 48 28 60 C 6 48 0 24 0 6 C 0 6 12 0 28 0 Z"
            fill="url(#shield-grad)" stroke="#E0F2FE" stroke-width="2"/>
      <circle cx="28" cy="22" r="6" fill="#FFFFFF"/>
      <polygon points="25,24 31,24 33,38 23,38" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY & WORDMARK ================= -->
  <g transform="translate(250, 310)" text-anchor="middle" class="font-sans">
    <!-- Brand Wordmark -->
    <text y="0" font-size="52" font-weight="800" letter-spacing="-1px">
      <tspan fill="#FFFFFF">Folder</tspan><tspan fill="url(#gold-text-grad)">Home</tspan>
    </text>

    <!-- Slogan -->
    <text y="36" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="-0.2px">
      Assistantify your home.
    </text>

    <!-- Subtitle Pill -->
    <g transform="translate(0, 64)">
      <rect x="-140" y="0" width="280" height="32" rx="16" fill="#1E293B" stroke="#0284C7" stroke-width="1.2"/>
      <text y="21" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.5px" class="font-mono">LOCAL-FIRST STRANDS AGENT</text>
    </g>
  </g>
</svg>