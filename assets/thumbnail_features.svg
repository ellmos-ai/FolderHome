<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0D1627" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="gold-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="720" rx="24" fill="url(#bg-grad)"/>
  <rect width="1280" height="720" rx="24" fill="url(#grid-pattern)"/>
  <rect width="1276" height="716" x="2" y="2" rx="22" fill="none" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 45)" class="font-sans">
    <rect width="255" height="28" rx="14" fill="#1E293B" stroke="#0284C7" stroke-width="1.2"/>
    <text x="127.5" y="18" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5px" text-anchor="middle" class="font-mono">CORE ARCHITECTURE &amp; PILLARS</text>

    <text x="0" y="72" font-size="42" font-weight="800" letter-spacing="-1px">
      <tspan fill="#FFFFFF">Folder</tspan><tspan fill="url(#gold-text-grad)">Home</tspan>
      <tspan fill="#94A3B8" font-size="26" font-weight="600"> · Architecture &amp; Feature Pillars</tspan>
    </text>
    <text x="2" y="98" font-size="14.5" font-weight="400" fill="#94A3B8">
      Local-first Strands agent turns scattered household documents into searchable, explainable and safely actionable workflows.
    </text>
  </g>

  <!-- ==================== 2X2 FEATURE GRID ==================== -->
  <g transform="translate(60, 175)" class="font-sans">

    <!-- Pillar 1: Ingestion & Index (Top Left) -->
    <g transform="translate(0, 0)">
      <rect width="560" height="230" rx="16" fill="#0C1322" stroke="#0284C7" stroke-width="1.5" filter="url(#soft-shadow)"/>
      <rect width="560" height="50" rx="16" fill="#0369A1" fill-opacity="0.15"/>

      <!-- Icon & Title -->
      <circle cx="34" cy="25" r="13" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.4"/>
      <path d="M 28 25 L 32 29 L 40 21" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <text x="58" y="31" font-size="15" font-weight="800" fill="#E0F2FE">01 · SMART DOCUMENT INGESTION</text>

      <g transform="translate(24, 74)" font-size="12.5" font-weight="500" fill="#94A3B8">
        <text y="0" fill="#F8FAFC" font-weight="700">✓ KnowledgeDigest Read-Only Index</text>
        <text y="20">Normalized SQLite FTS queries and natural-language document search</text>

        <text y="52" fill="#F8FAFC" font-weight="700">✓ Multi-Format &amp; Version Awareness</text>
        <text y="72">Parses PDF, TXT, scans, version diffs and archive candidates</text>

        <text y="104" fill="#F8FAFC" font-weight="700">✓ Topic Dossiers &amp; Folder Reports</text>
        <text y="124">Automatic synthesis across distributed household records</text>
      </g>
    </g>

    <!-- Pillar 2: Gated Planning (Top Right) -->
    <g transform="translate(600, 0)">
      <rect width="560" height="230" rx="16" fill="#0C1322" stroke="#D97706" stroke-width="1.5" filter="url(#soft-shadow)"/>
      <rect width="560" height="50" rx="16" fill="#78350F" fill-opacity="0.15"/>

      <circle cx="34" cy="25" r="13" fill="#78350F" stroke="#F59E0B" stroke-width="1.4"/>
      <circle cx="34" cy="25" r="5" fill="#FBBF24"/>
      <text x="58" y="31" font-size="15" font-weight="800" fill="#FEF3C7">02 · GATED PLANNING &amp; GOVERNANCE</text>

      <g transform="translate(24, 74)" font-size="12.5" font-weight="500" fill="#94A3B8">
        <text y="0" fill="#F8FAFC" font-weight="700">✓ strands.Agent 1.53.0 Master Architecture</text>
        <text y="20">Sequential bounded tool executor with deterministic fixtures</text>

        <text y="52" fill="#F8FAFC" font-weight="700">✓ Scoped Specialist Subagents</text>
        <text y="72">Dedicated planners for notes, medications, tax, and calendar</text>

        <text y="104" fill="#F8FAFC" font-weight="700">✓ Finite Resource Budgets &amp; Explicit Cloud Gates</text>
        <text y="124">Amazon Bedrock guarded by --allow-network &amp; sensitive data gate</text>
      </g>
    </g>

    <!-- Pillar 3: 26 Connected Workflows (Bottom Left) -->
    <g transform="translate(0, 250)">
      <rect width="560" height="230" rx="16" fill="#0C1322" stroke="#10B981" stroke-width="1.5" filter="url(#soft-shadow)"/>
      <rect width="560" height="50" rx="16" fill="#065F46" fill-opacity="0.15"/>

      <circle cx="34" cy="25" r="13" fill="#064E3B" stroke="#34D399" stroke-width="1.4"/>
      <path d="M 28 27 L 34 21 L 40 27 V 31 H 28 Z" fill="none" stroke="#34D399" stroke-width="1.6"/>
      <text x="58" y="31" font-size="15" font-weight="800" fill="#D1FAE5">03 · 26 CONNECTED HOME WORKFLOWS</text>

      <g transform="translate(24, 74)" font-size="12.5" font-weight="500" fill="#94A3B8">
        <text y="0" fill="#F8FAFC" font-weight="700">✓ Contracts, Cockpits &amp; Subscriptions</text>
        <text y="20">Automatic term tracking, cancellation notice and evidence links</text>

        <text y="52" fill="#F8FAFC" font-weight="700">✓ Health Dossiers &amp; Medication Schedules</text>
        <text y="72">Medical timeline extraction &amp; confirmed dosage tracking</text>

        <text y="104" fill="#F8FAFC" font-weight="700">✓ Finance, Official Notices &amp; ICS Calendar</text>
        <text y="124">33 verified endpoints across document and household services</text>
      </g>
    </g>

    <!-- Pillar 4: Sovereign Privacy & Reversible Actions (Bottom Right) -->
    <g transform="translate(600, 250)">
      <rect width="560" height="230" rx="16" fill="#0C1322" stroke="#8B5CF6" stroke-width="1.5" filter="url(#soft-shadow)"/>
      <rect width="560" height="50" rx="16" fill="#5B21B6" fill-opacity="0.15"/>

      <circle cx="34" cy="25" r="13" fill="#3B0764" stroke="#A78BFA" stroke-width="1.4"/>
      <rect x="30" y="23" width="8" height="7" rx="1" fill="none" stroke="#C084FC" stroke-width="1.4"/>
      <path d="M 31.5 23 V 21 C 31.5 19.5 32.5 18.5 34 18.5 C 35.5 18.5 36.5 19.5 36.5 21 V 23" fill="none" stroke="#C084FC" stroke-width="1.4"/>
      <text x="58" y="31" font-size="15" font-weight="800" fill="#EDE9FE">04 · LOCAL-FIRST PRIVACY &amp; REVERSIBLE ACTIONS</text>

      <g transform="translate(24, 74)" font-size="12.5" font-weight="500" fill="#94A3B8">
        <text y="0" fill="#F8FAFC" font-weight="700">✓ Strict Default Deny &amp; Never-Overwrite Policy</text>
        <text y="20">Chat never executes writes directly without exact plan confirmation</text>

        <text y="52" fill="#F8FAFC" font-weight="700">✓ Exact /confirm &lt;plan_id&gt; Verification</text>
        <text y="72">Deterministic plan hashes and separate execution confirmation</text>

        <text y="104" fill="#F8FAFC" font-weight="700">✓ Reversible File Actions &amp; Audited Changes</text>
        <text y="124">Older drafts and changes can be safely rolled back and audited</text>
      </g>
    </g>

  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(60, 672)" class="font-mono" font-size="11.5" font-weight="600" fill="#64748B">
    <text>https://github.com/ellmos-ai/FolderHome · MIT License · Local-First Architecture · 26 Connected Workflows</text>
  </g>
</svg>