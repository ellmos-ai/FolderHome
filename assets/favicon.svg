<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="folder-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="#0A0F1D"/>

  <!-- Folder Back -->
  <path d="M 6 16 L 6 52 C 6 54 8 56 10 56 L 54 56 C 56 56 58 54 58 52 L 58 22 C 58 20 56 18 54 18 L 30 18 L 25 12 C 24 11 22 10 20 10 L 10 10 C 8 10 6 12 6 14 Z" fill="#92400E"/>

  <!-- Paper -->
  <rect x="11" y="14" width="42" height="34" rx="2" fill="#FFFFFF"/>
  <line x1="15" y1="19" x2="32" y2="19" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="24" x2="45" y2="24" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Folder Front -->
  <path d="M 6 26 L 6 52 C 6 54 8 56 10 56 L 54 56 C 56 56 58 54 58 52 L 58 26 C 58 24 56 22 54 22 L 10 22 C 8 22 6 24 6 26 Z" fill="url(#folder-grad)" stroke="#FDE68A" stroke-width="0.75"/>

  <!-- House Silhouette -->
  <g transform="translate(18, 28)">
    <polygon points="14,0 28,10 26,12 14,3 2,12 0,10" fill="#FFFFFF"/>
    <rect x="4" y="10" width="20" height="15" fill="#0F172A" stroke="#FDE68A" stroke-width="0.75"/>
    <rect x="7" y="12" width="5" height="5" fill="#FBBF24"/>
    <rect x="15" y="14" width="6" height="11" fill="#1E293B" stroke="#FDE68A" stroke-width="0.5"/>
  </g>

  <!-- Shield -->
  <g transform="translate(40, 36)">
    <path d="M 8 0 C 13 0 16 2 16 2 C 16 7 14 14 8 18 C 2 14 0 7 0 2 C 0 2 3 0 8 0 Z" fill="url(#shield-grad)" stroke="#FFFFFF" stroke-width="0.75"/>
    <circle cx="8" cy="7" r="1.5" fill="#FFFFFF"/>
    <polygon points="7,8 9,8 9.5,12 6.5,12" fill="#FFFFFF"/>
  </g>
</svg>